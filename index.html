<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>從數位教學到 AI 協作｜臺南高商教師研習（SOIL 雙層旗艦版 v2：極簡投影＋學員講義）</title>
<style>
:root {
  --ink: #15304a;
  --muted: #587084;
  --blue: #176b9a;
  --mint: #0c7d78;
  --gold: #d78c2e;
  --danger: #c6362c;
  --paper: #f6f9fc;
  --card-bg: #ffffff;
  --line: #d6e3eb;
  --stage-bg: #dbe7ed;
  --shadow: 0 22px 70px #19364c28;
}
body.dark-mode {
  --ink: #f2f7fb;
  --muted: #a9c2d6;
  --blue: #38a3dc;
  --mint: #12b8ae;
  --gold: #ffbe4d;
  --danger: #ff6b57;
  --paper: #0e2030;
  --card-bg: #152c40;
  --line: #254561;
  --stage-bg: #08121b;
  --shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--stage-bg);
  color: var(--ink);
  font-family: "jf open 粉圓 2.1", "GenSenRounded TW", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s, color 0.2s;
}
button, a { font: inherit; }
button { cursor: pointer; }

.stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 34px 18px 64px;
}
.slide {
  width: min(94vw, calc(86vh * 16 / 9), 1600px);
  aspect-ratio: 16 / 9;
  background: var(--paper);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  display: none;
  flex-direction: column;
  padding: 3.5% 4.6% 2.6%;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.slide.active { display: flex; }
.slide::before {
  content: "";
  height: 10px;
  position: absolute;
  top: 0; left: 0; right: 0;
  background: linear-gradient(90deg, var(--blue), var(--mint), #7fc3ba);
}

/* Eyebrow Row */
.eyebrow-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.3%;
  gap: 12px;
}
.eyebrow {
  font-size: clamp(13px, 1.15vw, 19px);
  font-weight: 800;
  color: var(--mint);
  letter-spacing: 0.05em;
}
.jump-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 99px;
  background: #fff3df;
  color: #9a5406;
  border: 1.5px solid #ebb86b;
  font-size: clamp(12px, 0.95vw, 15px);
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.16s;
  white-space: nowrap;
}
body.dark-mode .jump-pill {
  background: rgba(255, 190, 77, 0.16);
  color: #ffbe4d;
  border-color: rgba(255, 190, 77, 0.55);
}
.jump-pill:hover {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
  transform: translateY(-1px);
}
.return-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #e6f4f1;
  border: 1.5px solid #85bfb9;
  border-radius: 10px;
  padding: 6px 14px;
  margin-bottom: 1.2%;
  cursor: pointer;
  color: #09524e;
  font-weight: 800;
  font-size: clamp(13px, 1.1vw, 17px);
  transition: background 0.15s;
}
.return-bar:hover { background: #d0ebe6; }
body.dark-mode .return-bar { background: #12383c; border-color: #1f7a82; color: #8de2d0; }

/* Headings */
.slide h1 {
  font-size: clamp(32px, 4.0vw, 64px);
  line-height: 1.18;
  margin: 0 0 1.6%;
  letter-spacing: -0.03em;
}
.slide h2 {
  font-size: clamp(25px, 2.8vw, 46px);
  line-height: 1.22;
  margin: 0 0 1.6%;
  letter-spacing: -0.025em;
}
.lead {
  font-size: clamp(18px, 1.9vw, 30px);
  line-height: 1.45;
  color: var(--muted);
}

/* Body */
.body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  font-size: clamp(16px, 1.58vw, 25px);
  line-height: 1.52;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.8%;
}
.body p { margin: 0.25em 0; }
.body ul, .body ol { margin: 0.2em 0; padding-left: 1.3em; }
.body li { margin: 0.22em 0; }

/* Grids */
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.2%;
  align-items: stretch;
}
.cols.three { grid-template-columns: repeat(3, 1fr); }
.cols.four { grid-template-columns: repeat(4, 1fr); gap: 1.6%; }

/* Cards */
.card {
  background: var(--card-bg);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 4.2% 4.8%;
  box-shadow: 0 5px 20px #1f4b6210;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card h3 {
  font-size: 1.18em;
  margin: 0 0 0.35em;
  color: var(--blue);
  line-height: 1.28;
}
.card.accent { background: #e9f5f3; border-color: #a8d5ce; }
.card.warm { background: #fff5e7; border-color: #efd2a4; }
.card.danger { background: #fff0ee; border-color: #f1b2aa; }
.card.danger h3 { color: var(--danger); }
body.dark-mode .card.accent { background: #113a44; border-color: #1f7a82; }
body.dark-mode .card.warm { background: #362813; border-color: #8f6220; }
body.dark-mode .card.danger { background: #3b1c19; border-color: #963b32; }

/* Buttons */
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-top: 0.4em;
}
.go-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0.48em 1.1em;
  border-radius: 14px;
  background: var(--blue);
  color: #ffffff !important;
  font-size: clamp(15px, 1.38vw, 22px);
  font-weight: 800;
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(23, 107, 154, 0.22);
  transition: transform 0.15s, background 0.15s;
}
.go-btn:hover { background: #0f5278; transform: translateY(-2px); }
.go-btn.mint { background: var(--mint); box-shadow: 0 6px 18px rgba(12, 125, 120, 0.22); }
.go-btn.mint:hover { background: #085c58; }
.go-btn.gold { background: var(--gold); box-shadow: 0 6px 18px rgba(215, 140, 46, 0.22); }
.go-btn.gold:hover { background: #b16f1b; }
.go-btn.outline {
  background: var(--card-bg);
  color: var(--blue) !important;
  border: 2px solid var(--blue);
  box-shadow: none;
}
body.dark-mode .go-btn.outline { color: #8de2d0 !important; border-color: #8de2d0; }
.go-btn.outline:hover { background: var(--blue); color: #fff !important; }

/* Helpers */
.big { font-size: 1.25em; font-weight: 800; line-height: 1.38; }
.huge { font-size: 1.78em; font-weight: 900; line-height: 1.28; color: var(--blue); }
.muted { color: var(--muted); }
.tag {
  display: inline-block;
  padding: 0.2em 0.65em;
  border-radius: 99px;
  background: #dceef4;
  color: #075d87;
  font-size: 0.7em;
  font-weight: 800;
  margin-bottom: 0.35em;
  align-self: flex-start;
}
body.dark-mode .tag { background: #1b4965; color: #8de2d0; }
.flow {
  display: flex;
  align-items: stretch;
  gap: 1.1%;
  margin: 1.2% 0;
}
.flow span {
  flex: 1;
  text-align: center;
  background: #e6f2f5;
  border-radius: 12px;
  padding: 1.1% 1.4%;
  font-weight: 800;
  font-size: 0.88em;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
body.dark-mode .flow span { background: #16364a; }
.flow i {
  align-self: center;
  color: var(--mint);
  font-style: normal;
  font-weight: 900;
  font-size: 1.2em;
}

/* Prompt Box */
.prompt-box {
  background: #102e45;
  color: #ffffff;
  border-radius: 15px;
  padding: 1.2em 1.4em;
  font-size: 0.85em;
  font-family: Consolas, Monaco, "Courier New", monospace;
  white-space: pre-wrap;
  line-height: 1.52;
  overflow: auto;
  border: 1px solid #234d6e;
}
.prompt-box strong { color: #8de2d0; }
.copy-btn {
  background: var(--mint);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.75em;
  font-weight: 800;
  margin-bottom: 6px;
  align-self: flex-end;
  cursor: pointer;
  transition: background 0.15s;
}
.copy-btn:hover { background: #085c58; }

/* Big Task Card */
.task-card {
  background: var(--mint);
  color: #ffffff;
  border-radius: 18px;
  padding: 4.8%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  box-shadow: 0 6px 22px rgba(12, 125, 120, 0.28);
}
.task-card h3 { font-size: 1.4em; margin: 0 0 0.5em; color: #fff; }
.task-card .target { font-size: 1.1em; font-weight: 800; margin-top: 0.6em; color: #d4eee9; }
.task-card .timer { font-size: 2.3em; font-weight: 900; margin: 0.25em 0; color: #fff; letter-spacing: 0.05em; }
.task-card button {
  align-self: flex-start;
  background: #ffffff;
  color: var(--mint);
  border: 0;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 0.8em;
  font-weight: 800;
  cursor: pointer;
  margin-top: 4px;
}
.task-card button:hover { background: #f0f7f6; }

/* Roadmap in P03 */
.roadmap {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1.1%;
  margin: 1.2% 0 1.8%;
}
.roadstep {
  position: relative;
  min-height: 220px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 16px 12px;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
}
body.dark-mode .roadstep { background: #152c40; }
.roadstep:hover { border-color: var(--mint); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(12, 125, 120, 0.18); }
.roadstep .num { font-size: 0.72em; color: var(--mint); font-weight: 900; }
.roadstep h3 { font-size: 1.1em; line-height: 1.22; margin: 0.3em 0 0.5em; color: var(--blue); }
.roadstep p { font-size: 0.76em; line-height: 1.42; color: var(--muted); }
.roadstep small {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  font-size: 0.64em;
  color: var(--blue);
  font-weight: 800;
}
.roadstep.current { background: #e9f5f3; border-color: #75bcb4; }
body.dark-mode .roadstep.current { background: #123e47; border-color: #12b8ae; }

/* 5-Station Progress */
.road-progress {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: auto;
  padding-top: 8px;
}
.road-seg {
  border: 1px solid var(--line);
  background: rgba(12, 125, 120, 0.06);
  color: var(--muted);
  border-radius: 99px;
  padding: 3px 8px;
  font-size: clamp(10px, 0.8vw, 12.5px);
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.road-seg:hover { border-color: var(--mint); transform: translateY(-1px); }
.road-seg.done { background: #d8efec; border-color: #85bfb9; color: #09524e; }
body.dark-mode .road-seg.done { background: #123b3f; border-color: #1f7a82; color: #9de8e1; }
.road-seg.current { background: var(--mint); border-color: var(--mint); color: #fff; box-shadow: 0 2px 10px rgba(12, 125, 120, 0.32); }

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  margin-top: 6px;
  padding-top: 6px;
  font-size: clamp(10px, 0.82vw, 13px);
  color: var(--muted);
}
.footer b { color: var(--mint); }

/* Controls */
.controls {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  align-items: center;
  background: rgba(19, 50, 71, 0.94);
  color: #fff;
  padding: 6px 12px;
  border-radius: 14px;
  z-index: 25;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(8px);
}
.controls button {
  border: 0;
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 700;
}
.controls button:hover { background: rgba(255, 255, 255, 0.3); }
.controls .counter { min-width: 95px; text-align: center; font-size: 13px; font-weight: 800; }
.controls .switch-btn { background: var(--gold); color: #fff; }
.controls .switch-btn:hover { background: #e89d3c; }

/* TOC */
.toc {
  position: fixed;
  left: 15px;
  top: 15px;
  z-index: 30;
  background: var(--card-bg);
  box-shadow: var(--shadow);
  border-radius: 14px;
  padding: 16px;
  max-height: 85vh;
  overflow: auto;
  width: min(440px, 92vw);
  display: none;
  border: 1px solid var(--line);
}
.toc.open { display: block; }
.toc h3 { margin: 8px 0 6px; font-size: 14px; color: var(--mint); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.toc button {
  display: block;
  width: 100%;
  border: 0;
  background: rgba(12, 125, 120, 0.05);
  text-align: left;
  margin: 3px 0;
  padding: 7px 10px;
  border-radius: 6px;
  color: var(--ink);
  font-size: 13px;
}
.toc button:hover { background: var(--mint); color: #fff; }

/* Presenter Speaker Mode */
.speaker { display: none; }
.speaker-mode { background: #122634; color: #ffffff; padding: 22px; }
.speaker-mode .stage, .speaker-mode .controls, .speaker-mode .toc { display: none; }
.speaker-mode .speaker { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
.speaker-mode .speaker h1 { font-size: 26px; margin: 0 0 8px; }
.speaker-mode .speaker h2 { font-size: 21px; color: #8de2d0; margin: 0 0 10px; }
.speaker-mode .speaker p { font-size: 18px; line-height: 1.55; }
.speaker-mode .speaker .panel { background: #1d394b; border-radius: 16px; padding: 22px; }
.speaker-mode .speaker button { border: 0; border-radius: 8px; padding: 9px 15px; margin-right: 8px; font-weight: 800; }
.speaker-mode .speaker .clock { font-size: 34px; font-weight: 900; color: #8de2d0; margin: 6px 0; }

@media (max-width: 820px) {
  .stage { display: block; padding: 12px 8px 76px; }
  .slide, .slide.active { width: 100%; min-height: calc(100dvh - 88px); height: auto; aspect-ratio: auto; padding: 24px 18px 20px; }
  .cols, .cols.three, .cols.four, .roadmap { grid-template-columns: 1fr; gap: 12px; }
  .roadstep { min-height: 120px; }
  .controls { max-width: 98vw; overflow-x: auto; }
}
</style>
</head>

<nav class="controls" aria-label="簡報導覽與控場工具列">

const stageTargets = ["P01", "P05", "P09", "P11", "P18"];

// ============================================================================
// ENGINE & NAVIGATION
// ============================================================================
let current = 0;
let pen = false;
const speakerMode = new URLSearchParams(location.search).has("presenter");

function getSlideIndexById(id) {
  if (!id) return -1;
  const clean = String(id).trim().toUpperCase();
  // 1. Direct match (e.g. "P04", "H01")
  let idx = slides.findIndex(s => s.id.toUpperCase() === clean);
  if (idx !== -1) return idx;
  // 2. Pure digits (e.g. "4" or "04" -> "P04")
  if (/^\d+$/.test(clean)) {
    const pId = "P" + clean.padStart(2, "0");
    idx = slides.findIndex(s => s.id.toUpperCase() === pId);
    if (idx !== -1) return idx;
  }
  return -1;
}

function jumpTo(id) {
  const idx = getSlideIndexById(id);
  if (idx !== -1) {
    show(idx);
  }
}

function slideHTML(s, i) {
  const isHandout = s.type === "handout";
  const stage = s.stage ?? 0;
  const phase = stage === 0 ? "引起動機" : (stage === 4 ? "喚起行動" : "維持注意");
  const eyebrowText = isHandout 
    ? `📖 學員實作講義庫 · ${s.id}` 
    : `📽️ ${s.id}／P20　${phase} · ${s.section}　${s.time}`;

  return `
    <article class="slide" data-index="${i}" data-id="${s.id}">
      <div class="eyebrow-row">
        <span class="eyebrow">${eyebrowText}</span>
        ${s.type === "stage" && stageToHandoutMap[s.id] ? `<button type="button" class="jump-pill" onclick="jumpTo('${stageToHandoutMap[s.id]}')">📋 查看學員講義 ➔</button>` : ""}
      </div>
      <h2>${s.title}</h2>
      <div class="body">${s.body}</div>
      ${!isHandout ? `
        <div class="road-progress" aria-label="研習路線：${route[stage][0]}">
          ${route.map((x, j) => `
            <div class="road-seg ${j < stage ? "done" : (j === stage ? "current" : "")}" onclick="jumpTo('${stageTargets[j]}')" title="${x[0]}">
              <span>0${j + 1} ${x[0]}</span>
              <span>${j < stage ? "✓" : (j === stage ? "●" : "○")}</span>
            </div>
          `).join("")}
        </div>
      ` : ""}
      <div class="footer">
        <span>臺南高商 AI 研習｜張秋芸（misszhang0119）｜2026.11.24</span>
        <b>${isHandout ? "附錄講義庫 · 一鍵複製與詳細指南" : `${route[stage][0]} · 來源 ➔ Prompt ➔ 草稿 ➔ 查核 ➔ 保存`}</b>
      </div>
      <canvas class="drawing-canvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10"></canvas>
    </article>
  `;
}

function render() {
  document.getElementById("stage").innerHTML = slides.map(slideHTML).join("");
  
  // Build TOC
  let tocHTML = `<h3>📽️ 台上極簡投影 (P01–P20)</h3>`;
  slides.filter(s => s.type === "stage").forEach(s => {
    tocHTML += `<button type="button" onclick="jumpTo('${s.id}')"><b>${s.id}</b> ${s.title}</button>`;
  });
  tocHTML += `<h3 style="margin-top:14px">📖 學員指令講義 (H01–H08)</h3>`;
  slides.filter(s => s.type === "handout").forEach(s => {
    tocHTML += `<button type="button" onclick="jumpTo('${s.id}')" style="background:#fff3df;color:#9a5406"><b>${s.id}</b> ${s.title.replace("學員講義 " + s.id + "｜", "")}</button>`;
  });
  document.getElementById("toc").innerHTML = tocHTML;

  show(0, false);
  setupDrawing();
}

function show(n, broadcast = true) {
  current = Math.max(0, Math.min(slides.length - 1, n));
  const s = slides[current];
  if (s.type === "stage") {
    lastStageId = s.id;
  }
  document.querySelectorAll(".slide").forEach((el, i) => el.classList.toggle("active", i === current));
  
  // Update counter
  const counterEl = document.getElementById("counter");
  if (s.type === "stage") {
    counterEl.textContent = `投影 ${s.id} / P20`;
    counterEl.style.color = "#8de2d0";
  } else {
    counterEl.textContent = `講義 ${s.id} / H08`;
    counterEl.style.color = "#ffbe4d";
  }

  document.getElementById("toc").classList.remove("open");
  if (broadcast) {
    try { history.replaceState(null, "", `#slide-${s.id}`); } catch (e) {}
  }
  updateSpeaker();
}

function updateSpeaker() {
  const s = slides[current];
  const next = slides[current + 1];
  const speakerEl = document.getElementById("speaker");
  if (!speakerEl) return;
  speakerEl.innerHTML = `
    <div class="panel">
      <h1>講師控場視窗｜${s.id}（${s.type === "stage" ? "台上投影" : "學員講義"}）</h1>
      <h2>${s.title}</h2>
      <p class="clock" id="wallClock"></p>
      <p>建議時段：${s.time || "講義附錄"}</p>
      <p style="font-size:18px;color:#d4eee9"><b>講師心法：</b>${s.note || "學員操作指引卡，供學員自學或現場複製指令。"}</p>
      <div style="margin-top:16px">
        <button type="button" onclick="show(current-1)">← 上一頁</button>
        <button type="button" onclick="show(current+1)">下一頁 →</button>
      </div>
    </div>
    <div class="panel">
      <h2>下一頁預覽</h2>
      <div style="background:#154557;padding:15px;border-radius:12px">
        ${next ? `<h3>${next.id}：${next.title}</h3><p>${next.section || "附錄"}｜${next.time || ""}</p>` : "研習結束"}
      </div>
    </div>
  `;
}

function setupDrawing() {
  document.querySelectorAll("canvas").forEach(c => {
    const resize = () => {
      const rect = c.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      if (rect.width && rect.height) {
        c.width = rect.width * ratio;
        c.height = rect.height * ratio;
        c.getContext("2d").scale(ratio, ratio);
      }
    };
    resize();
    let drawing = false;
    const ctx = c.getContext("2d");
    c.addEventListener("pointerdown", e => {
      if (!pen) return;
      drawing = true;
      c.setPointerCapture(e.pointerId);
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    c.addEventListener("pointermove", e => {
      if (!drawing) return;
      ctx.strokeStyle = "#d8303d";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });
    c.addEventListener("pointerup", () => drawing = false);
  });
}

// Global Click Handlers
document.addEventListener("click", e => {
  // Copy button
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) {
    const textEl = document.getElementById(copyBtn.dataset.copy);
    if (textEl) {
      navigator.clipboard.writeText(textEl.textContent).then(() => {
        const orig = copyBtn.textContent;
        copyBtn.textContent = "✔ 已成功複製！";
        copyBtn.style.background = "#0c7d78";
        setTimeout(() => { copyBtn.textContent = orig; copyBtn.style.background = ""; }, 1800);
      });
    }
    return;
  }

  // Timer button
  if (e.target.classList.contains("startTimer")) {
    const card = e.target.closest(".task-card");
    const timerDisplay = card.querySelector(".timer");
    if (timerDisplay._interval) {
      clearInterval(timerDisplay._interval);
      timerDisplay._interval = null;
      e.target.textContent = "▶ 繼續倒數";
      return;
    }
    let left = timerDisplay._left ?? (+timerDisplay.dataset.minutes * 60);
    e.target.textContent = "⏸ 暫停";
    timerDisplay._interval = setInterval(() => {
      left = Math.max(0, left - 1);
      timerDisplay._left = left;
      const m = Math.floor(left / 60);
      const s = left % 60;
      timerDisplay.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      if (!left) {
        clearInterval(timerDisplay._interval);
        timerDisplay._interval = null;
        timerDisplay.style.color = "#ffd8a6";
        e.target.textContent = "✔ 時間到！";
      }
    }, 1000);
  }
});

// Controls Handlers
document.getElementById("prev").onclick = () => show(current - 1);
document.getElementById("next").onclick = () => show(current + 1);
document.getElementById("tocBtn").onclick = () => document.getElementById("toc").classList.toggle("open");
document.getElementById("roadBtn").onclick = () => jumpTo("P03");
document.getElementById("fullBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById("themeBtn").onclick = () => document.body.classList.toggle("dark-mode");
document.getElementById("speakerBtn").onclick = () => {
  const u = new URL(location.href);
  u.searchParams.set("presenter", "1");
  window.open(u.href, "speaker-win", "width=1100,height=750");
};
document.getElementById("drawBtn").onclick = () => {
  pen = !pen;
  document.querySelectorAll("canvas").forEach(c => c.style.pointerEvents = pen ? "auto" : "none");
  document.getElementById("drawBtn").style.background = pen ? "#b2273b" : "";
};
document.getElementById("clearBtn").onclick = () => {
  const c = document.querySelectorAll("canvas")[current];
  if (c) c.getContext("2d").clearRect(0, 0, c.width, c.height);
};

// Smart Toggle between Stage & Handout (H key & button)
function toggleSection() {
  const s = slides[current];
  if (s.type === "stage") {
    // Jump to the specific handout mapped to this stage
    const targetH = stageToHandoutMap[s.id] || "H01";
    jumpTo(targetH);
  } else {
    // Return to the last visited stage or default mapped stage
    const targetP = lastStageId || handoutToStageMap[s.id] || "P01";
    jumpTo(targetP);
  }
}
document.getElementById("switchSectionBtn").onclick = toggleSection;

// Keyboard Shortcuts
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, button, a") || e.target.closest("[role='button']")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(current + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(slides.length - 1);
  if (e.key.toLowerCase() === "r") jumpTo("P03");
  if (e.key.toLowerCase() === "f") document.getElementById("fullBtn").click();
  if (e.key.toLowerCase() === "t") document.getElementById("themeBtn").click();
  if (e.key.toLowerCase() === "m") document.getElementById("tocBtn").click();
  if (e.key.toLowerCase() === "h") toggleSection();
  if (e.key.toLowerCase() === "d") document.getElementById("drawBtn").click();
  if (e.key.toLowerCase() === "c") document.getElementById("clearBtn").click();
  if (e.key === "Escape") document.getElementById("toc").classList.remove("open");
});

// Wall Clock
setInterval(() => {
  const c = document.getElementById("wallClock");
  if (c) c.textContent = new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Taipei" });
}, 1000);

render();

// Hash router on load
const hashMatch = location.hash.match(/^#slide-(P\d+|H\d+|\d+)$/i);
if (hashMatch) {
  jumpTo(hashMatch[1]);
}
if (speakerMode) {
  document.body.classList.add("speaker-mode");
}
</script>
